services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shrike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-shrike}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shrike} -d ${POSTGRES_DB:-shrike}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  shrike:
    image: tomicdd/shrike:${SHRIKE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SHRIKE_PG_DSN: postgres://${POSTGRES_USER:-shrike}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shrike}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SHRIKE_LLM_PROVIDER: ${SHRIKE_LLM_PROVIDER:-}
      SHRIKE_LLM_MODEL: ${SHRIKE_LLM_MODEL:-}
      SHRIKE_LLM_BASE_URL: ${SHRIKE_LLM_BASE_URL:-}
      SHRIKE_LLM_PROXY: ${SHRIKE_LLM_PROXY:-}
    ports:
      - "8787:8787"
      # DeepSeek OAuth 回调监听(dsh 形态,仅绑定宿主机回环,不暴露局域网)
      - "127.0.0.1:3080:3080"
      - "127.0.0.1:8788:8788"
    volumes:
      # 本地编译的二进制直接覆盖镜像内置的 /app/shrike（构建方法见 Dockerfile 头部
      # 注释；二进制为静态链接，宿主机跑 `go build` 出 linux/arm64 即可）。
      # 删掉这一行即恢复官方镜像自带二进制。
      - ./dist/arm64/shrike:/app/shrike
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
